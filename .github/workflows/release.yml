name: release

# 发布一个 GitHub Release(非 draft)即触发,把包发布到 npm。
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 安全审计门禁:只审计生产依赖(发布 tarball 真正携带的 dependencies)。
      # devDependencies(vitest/vite)不进产物,--prod 避免其漏洞误伤发布。
      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: Test
        run: pnpm test

      - name: Publish
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
