name: release

# 发布一个 GitHub Release(非 draft)即触发,把包发布到 npm。
# 首次使用前需要在 repo Settings → Secrets → Actions 里加一个 npm token
# (见 README「发布到 npm」),名称为 NPM_TOKEN。
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm provenance:让 npm 校验「该包确实由此 GitHub Actions 构建」。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 安全审计门禁:只审计生产依赖(发布 tarball 真正携带的 dependencies)。
      # devDependencies(如 vitest/vite)不进入产物,`--prod` 避免其漏洞误伤发布。
      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: Test
        run: pnpm test

      - name: Publish
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
